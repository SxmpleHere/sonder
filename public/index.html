<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Physics Football — Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#09090e;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:monospace;
  color:#fff;
}
#wrap{
  position:relative;
  width:min(98vw,1000px);
  aspect-ratio:16/9;
  border:4px solid #1f1f2e;
  box-shadow:0 0 0 4px #08080c,0 0 50px rgba(0,0,0,.9);
  background:#153317;
  border-radius:8px;
  overflow:hidden
}
canvas{
  width:100%;
  height:100%;
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges
}
#menu{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(5,5,10,.92);
  gap:14px;
  padding:20px;
  text-align:center;
}
#menu h1{
  font-size:22px;
  letter-spacing:1px;
  color:#ffd23f;
  text-shadow:2px 2px 0 #000;
}
#menu p{font-size:11px;opacity:.8;max-width:420px;line-height:1.5}
#menu input{
  background:#0d0d14;
  border:2px solid #2a2a3a;
  color:#fff;
  padding:8px 12px;
  font-family:monospace;
  font-size:14px;
  text-align:center;
  letter-spacing:3px;
  text-transform:uppercase;
  border-radius:4px;
  width:160px;
}
#menu button{
  background:#ffd23f;
  border:none;
  color:#000;
  padding:10px 22px;
  font-family:monospace;
  font-weight:bold;
  font-size:13px;
  letter-spacing:1px;
  border-radius:4px;
  cursor:pointer;
  transition:transform .1s;
}
#menu button:hover{transform:scale(1.05)}
#menu button:active{transform:scale(.97)}
#menu .secondary{
  background:transparent;
  border:2px solid #ffd23f;
  color:#ffd23f;
}
#roomCode{
  font-size:28px;
  font-weight:bold;
  color:#2bff88;
  letter-spacing:6px;
  text-shadow:2px 2px 0 #000;
  padding:6px 12px;
  border:2px dashed #2bff88;
  border-radius:6px;
}
#status{font-size:11px;opacity:.7;min-height:16px}
#hint{
  position:absolute;
  top:6px;left:50%;
  transform:translateX(-50%);
  font-size:9px;
  color:#fff;
  opacity:.65;
  pointer-events:none;
  text-shadow:1px 1px 0 #000;
}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="hint"></div>

  <div id="menu">
    <h1>PIXEL PHYSICS FOOTBALL</h1>
    <p>Move with WASD / Arrows. Right-click (or hold dash button) to dash toward the cursor. First to score wins the round.</p>

    <button id="createBtn">CREATE ROOM</button>

    <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
      <input id="roomInput" maxlength="6" placeholder="CODE" />
      <button id="joinBtn" class="secondary">JOIN</button>
    </div>

    <div id="roomCode" style="display:none;"></div>
    <div id="status"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* =========================
   SETUP
========================= */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const menu = document.getElementById('menu');
const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');
const roomInput = document.getElementById('roomInput');
const roomCodeEl = document.getElementById('roomCode');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');

const W = 320, H = 180;
const WALL = 10;
const GOAL_Y = H/2 - 24;
const GOAL_H = 48;
const GOAL_DEPTH = 18;

const GOALS = [
  { x:WALL-GOAL_DEPTH, y:GOAL_Y, w:GOAL_DEPTH, h:GOAL_H, color:'#ff4b4b' },
  { x:W-WALL,          y:GOAL_Y, w:GOAL_DEPTH, h:GOAL_H, color:'#2bff88' }
];

const POSTS = [
  { x:WALL, y:GOAL_Y, r:2.5 },
  { x:WALL, y:GOAL_Y+GOAL_H, r:2.5 },
  { x:W-WALL, y:GOAL_Y, r:2.5 },
  { x:W-WALL, y:GOAL_Y+GOAL_H, r:2.5 }
];

/* =========================
   NETWORK STATE
========================= */

const socket = io();

let mySide = null;
let roomId = null;
let latestState = null;   // from server
let smoothedPlayers = []; // client-side interpolation
let smoothedBall = null;

let particles = [];
let shock = [];
let flash = 0;
let shake = 0;
let goalInfo = null;
let scorePulse = 0;

const keys = {};
let mouseX = W/2, mouseY = H/2;
let dashRequested = false;

/* =========================
   INPUT
========================= */

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)){
    e.preventDefault();
  }
});

addEventListener('keyup', e=>{
  keys[e.key.toLowerCase()] = false;
});

addEventListener('blur', ()=>{
  for(const k in keys) keys[k] = false;
});

cv.addEventListener('contextmenu', e=>e.preventDefault());

cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  mouseX = (e.clientX - r.left)/r.width * W;
  mouseY = (e.clientY - r.top)/r.height * H;
});

cv.addEventListener('mousedown', e=>{
  if(e.button === 2){
    e.preventDefault();
    dashRequested = true;
  }
});

// Also allow space to dash toward mouse (keyboard-friendly)
addEventListener('keydown', e=>{
  if(e.key === ' ' && mySide){
    dashRequested = true;
  }
});

/* =========================
   MENU
========================= */

createBtn.addEventListener('click', ()=>{
  socket.emit('createRoom');
});

joinBtn.addEventListener('click', ()=>{
  const code = roomInput.value.trim().toUpperCase();
  if(code.length < 4){
    statusEl.textContent = 'Enter a valid room code';
    return;
  }
  socket.emit('joinRoom', code);
});

roomInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') joinBtn.click();
});

socket.on('roomJoined', ({ roomId: id, side })=>{
  roomId = id;
  mySide = side;

  roomCodeEl.style.display = 'block';
  roomCodeEl.textContent = id;
  statusEl.textContent = 'Waiting for opponent…';

  hintEl.textContent =
    side === 'left'
      ? 'You are RED (left). Move: WASD, Dash: right-click / space'
      : 'You are GREEN (right). Move: WASD, Dash: right-click / space';
});

socket.on('opponentJoined', ()=>{
  statusEl.textContent = 'Opponent joined! Starting…';
  setTimeout(()=>{ menu.style.display = 'none'; }, 500);
});

socket.on('opponentLeft', ()=>{
  menu.style.display = 'flex';
  statusEl.textContent = 'Opponent left. Waiting for a new player…';
});

socket.on('errorMsg', (msg)=>{
  statusEl.textContent = msg;
});

socket.on('state', (st)=>{
  latestState = st;
});

/* =========================
   INTERPOLATION
========================= */

function lerp(a, b, t){ return a + (b - a)*t; }

function interpolate(){
  if(!latestState) return;

  if(smoothedPlayers.length !== latestState.players.length){
    smoothedPlayers = latestState.players.map(p => ({ ...p }));
  }
  if(!smoothedBall){
    smoothedBall = { ...latestState.ball };
  }

  const t = 0.35;
  for(let i=0;i<latestState.players.length;i++){
    const src = latestState.players[i];
    const dst = smoothedPlayers[i];
    dst.x = lerp(dst.x, src.x, t);
    dst.y = lerp(dst.y, src.y, t);
    dst.facingX = lerp(dst.facingX, src.facingX, t);
    dst.facingY = lerp(dst.facingY, src.facingY, t);
    dst.walk = lerp(dst.walk, src.walk, t);
    dst.flying = src.flying;
    dst.dashCooldown = src.dashCooldown;
    dst.side = src.side;
  }

  smoothedBall.x = lerp(smoothedBall.x, latestState.ball.x, t);
  smoothedBall.y = lerp(smoothedBall.y, latestState.ball.y, t);
  smoothedBall.vx = latestState.ball.vx;
  smoothedBall.vy = latestState.ball.vy;

  // Detect new goal event
  if(latestState.goal && latestState.goal !== goalInfo){
    goalInfo = latestState.goal;
    flash = 1;
    shake = 10;
    shock.push({ x:goalInfo.cx, y:goalInfo.cy, t:0, color:goalInfo.color });

    for(let i=0;i<90;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 1 + Math.random()*5.5;
      particles.push({
        x: goalInfo.cx,
        y: goalInfo.cy,
        vx: Math.cos(a)*sp,
        vy: Math.sin(a)*sp,
        life: 25 + Math.random()*35,
        c: [goalInfo.color,'#ffd23f','#fff','#ff8a00'][i%4],
        s: 1 + ((Math.random()*3)|0)
      });
    }
  }

  // Clear goal info when round resets
  if(latestState.won === false && goalInfo && !latestState.goal){
    goalInfo = null;
  }
}

/* =========================
   INPUT SEND (60Hz)
========================= */

function getMyInput(){
  let ix = 0, iy = 0;
  if(keys['a'] || keys['arrowleft']) ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup']) iy -= 1;
  if(keys['s'] || keys['arrowdown']) iy += 1;
  return { ix, iy };
}

setInterval(()=>{
  if(!mySide) return;

  const { ix, iy } = getMyInput();

  const payload = { ix, iy };

  if(dashRequested){
    payload.dash = true;
    payload.dashX = mouseX;
    payload.dashY = mouseY;
    dashRequested = false;
  }

  socket.emit('input', payload);
}, 1000/60);

/* =========================
   PITCH CACHE (identical to before)
========================= */

const pitchCache = document.createElement('canvas');
pitchCache.width = W;
pitchCache.height = H;

function buildPitch(){
  const c = pitchCache.getContext('2d');
  let seed = 7;
  const rnd = () => (seed = (seed*16807)%2147483647) / 2147483647;

  c.fillStyle = '#14141d';
  c.fillRect(0,0,W,H);

  const crowd = ['#e63946','#f1faee','#ffd23f','#457b9d','#2a9d8f','#a8dadc','#c77dff'];

  for(let y=0;y<H;y+=2){
    for(let x=0;x<W;x+=2){
      if(x>=WALL && x<W-WALL && y>=WALL && y<H-WALL) continue;
      if(rnd() < .55){
        c.fillStyle = crowd[(rnd()*crowd.length)|0];
        c.globalAlpha = .35 + rnd()*.3;
        c.fillRect(x,y,1,1);
      }
    }
  }
  c.globalAlpha = 1;

  c.fillStyle = '#1f1f2e';
  c.fillRect(WALL-3, WALL-3, W-2*WALL+6, 3);
  c.fillRect(WALL-3, H-WALL, W-2*WALL+6, 3);

  const ads = ['#ffd23f','#e63946','#2bff88','#4cc9f0'];
  for(let x=WALL-3,i=0; x<W-WALL+3; x+=14,i++){
    c.fillStyle = ads[i%4];
    c.fillRect(x, WALL-3, 10, 2);
    c.fillRect(x, H-WALL+1, 10, 2);
  }

  const gx=WALL, gy=WALL, gw=W-2*WALL, gh=H-2*WALL;

  for(let i=0; i*20<gw; i++){
    c.fillStyle = i%2 ? '#1a4a1d' : '#215427';
    c.fillRect(gx+i*20, gy, 20, gh);
  }

  for(let i=0;i<900;i++){
    c.fillStyle = rnd()<.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.09)';
    c.fillRect(gx+((rnd()*gw)|0), gy+((rnd()*gh)|0), 1, 1);
  }

  const wear = (x,y,r)=>{
    const g = c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(120,90,40,.22)');
    g.addColorStop(1,'rgba(120,90,40,0)');
    c.fillStyle = g;
    c.fillRect(x-r,y-r,2*r,2*r);
  };
  wear(W/2,H/2,22); wear(WALL+6,H/2,22); wear(W-WALL-6,H/2,22);

  c.strokeStyle = 'rgba(255,255,255,.75)';
  c.lineWidth = 1;

  c.strokeRect(gx+.5, gy+.5, gw-1, gh-1);
  c.beginPath();
  c.moveTo(W/2+.5, gy);
  c.lineTo(W/2+.5, H-WALL);
  c.stroke();

  c.beginPath();
  c.arc(W/2+.5, H/2+.5, 22, 0, Math.PI*2);
  c.stroke();

  c.fillStyle = 'rgba(255,255,255,.85)';
  c.fillRect(W/2-1, H/2-1, 3, 3);

  const pH=68, pW=32, sH=30, sW=12;
  c.strokeRect(gx+.5, H/2-pH/2+.5, pW, pH);
  c.strokeRect(W-WALL-pW+.5, H/2-pH/2+.5, pW, pH);
  c.strokeRect(gx+.5, H/2-sH/2+.5, sW, sH);
  c.strokeRect(W-WALL-sW+.5, H/2-sH/2+.5, sW, sH);

  c.fillRect(gx+22, H/2, 2, 2);
  c.fillRect(W-WALL-24, H/2, 2, 2);

  c.beginPath();
  c.arc(gx+23, H/2+1, 12, -Math.acos(9/12), Math.acos(9/12));
  c.stroke();

  c.beginPath();
  c.arc(W-WALL-23, H/2+1, 12, Math.PI-Math.acos(9/12), Math.PI+Math.acos(9/12));
  c.stroke();

  for(const [x,y,a] of [[gx,gy,0],[W-WALL,gy,.5],[W-WALL,H-WALL,1],[gx,H-WALL,1.5]]){
    c.beginPath();
    c.arc(x+.5, y+.5, 4, a*Math.PI, (a+.5)*Math.PI);
    c.stroke();
  }

  const v = c.createRadialGradient(W/2,H/2,60, W/2,H/2,200);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,.35)');
  c.fillStyle = v;
  c.fillRect(0,0,W,H);
}
buildPitch();

/* =========================
   DRAW HELPERS
========================= */

function drawPitch(){ ctx.drawImage(pitchCache, 0, 0); }

function drawGoals(){
  for(const g of GOALS){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(g.x, g.y, g.w, g.h);

    ctx.strokeStyle = 'rgba(240,240,240,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x=g.x; x<=g.x+g.w; x+=4){
      ctx.moveTo(x+.5, g.y);
      ctx.lineTo(x+.5, g.y+g.h);
    }
    for(let y=g.y; y<=g.y+g.h; y+=4){
      ctx.moveTo(g.x, y+.5);
      ctx.lineTo(g.x+g.w, y+.5);
    }
    ctx.stroke();

    ctx.strokeStyle = '#ccc';
    ctx.strokeRect(g.x+.5, g.y+.5, g.w-1, g.h-1);

    ctx.fillStyle = g.color;
    ctx.fillRect(g.x<W/2 ? g.x : g.x+g.w-1, g.y, 1, g.h);
  }

  ctx.fillStyle = '#fff';
  for(const p of POSTS){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#999';
    ctx.fillRect(p.x-1, p.y-1, 2, 2);
    ctx.fillStyle = '#fff';
  }
}

function drawBall(b){
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y+b.r+1, b.r, 2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(b.x|0, b.y|0, b.r, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#111';
  ctx.fillRect((b.x-1)|0, (b.y-1)|0, 3, 3);
  ctx.fillRect((b.x-3)|0, (b.y-2)|0, 2, 2);
  ctx.fillRect((b.x+2)|0, (b.y+1)|0, 2, 2);
}

function drawPlayer(p, isMe){
  // Different body color per side, plus a subtle highlight if it's you
  const shirt = p.side === 'left' ? '#e63946' : '#2bff88';
  const shirtDark = p.side === 'left' ? '#d62828' : '#1fe07a';

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.atan2(p.facingY, p.facingX));

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 1, 6, 4, 0, 0, Math.PI*2);
  ctx.fill();

  const lo = Math.sin(p.walk*5)*2.5;

  ctx.fillStyle='#111';
  ctx.fillRect(-3+lo, -6, 3, 2);
  ctx.fillRect(-3-lo, 4, 3, 2);

  ctx.fillStyle='#f3b483';
  ctx.fillRect(-2+lo, -5, 2, 2);
  ctx.fillRect(-2-lo, 3, 2, 2);

  ctx.fillStyle='#fff';
  ctx.fillRect(-3, -5, 4, 3);
  ctx.fillRect(-3, 2, 4, 3);

  ctx.fillStyle = shirt;
  ctx.fillRect(-4, -4, 7, 8);

  ctx.fillStyle = shirtDark;
  ctx.fillRect(-4, -4, 2, 8);

  ctx.fillStyle='#f3b483';
  ctx.fillRect(-lo*.6, -6, 2, 2);
  ctx.fillRect(lo*.6, 4, 2, 2);

  ctx.beginPath();
  ctx.arc(0, 0, 3.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#3a2510';
  ctx.beginPath();
  ctx.arc(-1, 0, 3.2, Math.PI*.35, Math.PI*1.65);
  ctx.fill();

  ctx.fillStyle='#111';
  ctx.fillRect(1, -1.5, 1, 1);
  ctx.fillRect(1, .5, 1, 1);

  ctx.restore();

  // "YOU" indicator
  if(isMe){
    ctx.save();
    ctx.globalAlpha = .55 + Math.sin(performance.now()*0.005)*.15;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawExplosion(){
  for(const sw of shock){
    const k = sw.t/40;

    if(sw.t < 12){
      ctx.globalAlpha = (1-sw.t/12)*.9;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, 6+sw.t*2.8, 0, Math.PI*2);
      ctx.fill();

      ctx.globalAlpha = (1-sw.t/12)*.6;
      ctx.fillStyle = sw.color;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, 10+sw.t*4, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.globalAlpha = 1-k;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 5*(1-k)+1;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, k*100, 0, Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle='#fff';
    ctx.lineWidth = 2*(1-k)+.5;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, k*62, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawGoalText(){
  if(!goalInfo) return;

  const out = Math.min(1, (120 - Math.max(0, 120 - shock[0]?.t * 3 || 1))/20);
  // simpler: just fade using pulse
  const alpha = Math.max(0, Math.min(1, 1 - (shock[0]?.t || 0)/45));

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, H/2-16);
  ctx.rotate(-.06);
  ctx.scale(1 + Math.sin(performance.now()*0.01)*.03, 1 + Math.sin(performance.now()*0.01)*.03);

  const col = goalInfo.color;

  ctx.fillStyle = col;
  ctx.globalAlpha = alpha*.55;
  ctx.fillRect(-W/2, -19, W, 38);

  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff';
  ctx.fillRect(-W/2, -19, W, 1);
  ctx.fillRect(-W/2, 18, W, 1);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.font = '900 34px monospace';

  ctx.lineWidth = 7;
  ctx.strokeStyle = '#000';
  ctx.strokeText('GOAL!', 0, 0);

  ctx.lineWidth = 4;
  ctx.strokeStyle = col;
  ctx.strokeText('GOAL!', 0, 0);

  const gr = ctx.createLinearGradient(0,-16,0,16);
  gr.addColorStop(0,'#fff');
  gr.addColorStop(1,'#ffd23f');
  ctx.fillStyle = gr;
  ctx.fillText('GOAL!', 0, 0);

  ctx.restore();

  // speed
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 13px monospace';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.strokeText(goalInfo.speedKph + ' kph', W/2, H/2 + 16);
  ctx.fillStyle = '#fff';
  ctx.fillText(goalInfo.speedKph + ' kph', W/2, H/2 + 16);
  ctx.restore();
}

function drawDashUI(){
  if(!mySide || !smoothedPlayers.length) return;

  const me = smoothedPlayers.find(p => p.side === mySide);
  if(!me) return;

  const maxCD = 180;
  const ready = me.dashCooldown <= 0;
  const p = ready ? 1 : 1 - (me.dashCooldown / maxCD);

  const cx = 24;
  const cy = H - 24;
  const R = 9;

  ctx.save();

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.arc(cx, cy, R+3, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.stroke();

  const startAngle = -Math.PI/2;
  const endAngle = startAngle + Math.PI*2*p;

  ctx.strokeStyle = ready ? '#2bff88' : '#ffd23f';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, R, startAngle, endAngle);
  ctx.stroke();

  if(ready){
    ctx.globalAlpha = 0.35 + Math.sin(performance.now()*0.006)*0.15;
    ctx.fillStyle = '#2bff88';
    ctx.beginPath();
    ctx.arc(cx, cy, R-3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = ready ? '#0a0a0a' : 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.moveTo(cx+1,  cy-5);
  ctx.lineTo(cx-2,  cy+0.5);
  ctx.lineTo(cx+0.5,cy+0.5);
  ctx.lineTo(cx-1,  cy+5);
  ctx.lineTo(cx+3,  cy-1);
  ctx.lineTo(cx+0.5,cy-1);
  ctx.closePath();
  ctx.fill();

  ctx.font = 'bold 6px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = ready ? '#2bff88' : 'rgba(255,255,255,0.55)';
  ctx.fillText(ready ? 'READY' : 'DASH', cx, cy + R + 8);

  ctx.restore();
}

/* =========================
   RENDER
========================= */

function render(){
  ctx.save();

  if(shake > .3){
    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  drawPitch();
  drawGoals();

  if(smoothedBall && !latestState?.won){
    drawBall(smoothedBall);
  }

  for(const p of particles){
    ctx.globalAlpha = Math.min(1, p.life/20);
    ctx.fillStyle = p.c;
    const z = p.s || 2;
    ctx.fillRect(p.x|0, p.y|0, z, z);
    ctx.globalAlpha = 1;
  }

  drawExplosion();

  for(const p of smoothedPlayers){
    drawPlayer(p, p.side === mySide);
  }

  ctx.restore();

  if(flash > .02){
    ctx.globalAlpha = flash*.65;
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

  drawDashUI();

  if(latestState?.won){
    drawGoalText();
  }
}

/* =========================
   LOOP
========================= */

function loop(){
  interpolate();

  flash *= .88;
  shake *= .9;

  for(const sw of shock) sw.t++;
  shock = shock.filter(sw => sw.t < 40);

  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= .93;
    p.vy *= .93;
    if(--p.life <= 0) particles.splice(i, 1);
  }

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

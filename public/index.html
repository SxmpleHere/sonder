<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sondera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#05050a;
  background-image:
    radial-gradient(ellipse at 50% 0%, #14142a 0%, #05050a 70%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:'Silkscreen', monospace;
  color:#e8e8f0;
  -webkit-font-smoothing:none;
  font-smooth:never;
  image-rendering:pixelated;
}

#wrap{
  position:relative;
  width:min(96vw,960px);
  aspect-ratio:16/9;
  border:3px solid #2a2a44;
  box-shadow:
    inset 0 0 0 3px #0a0a12,
    0 0 0 3px #05050a,
    0 12px 60px rgba(0,0,0,.9),
    0 0 90px rgba(43,255,136,.06);
  background:#153317;
  overflow:hidden;
  image-rendering:pixelated;
}

canvas{
  width:100%;height:100%;display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* ================================
   PIXEL UI
   ================================ */

#menu{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(20,20,42,.85) 0%, rgba(5,5,10,.98) 70%),
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.35) 2px 3px);
  gap:14px;
  padding:16px;
  text-align:center;
  z-index:5;
}

/* Logo */
.logo-wrap{
  position:relative;
  padding:0;
  margin-bottom:4px;
}
.logo{
  font-family:'Silkscreen', monospace;
  font-size:36px;
  font-weight:700;
  letter-spacing:6px;
  color:#fff;
  text-shadow:
    2px 0 0 #0a0a12, -2px 0 0 #0a0a12, 0 2px 0 #0a0a12, 0 -2px 0 #0a0a12,
    2px 2px 0 #0a0a12, -2px -2px 0 #0a0a12, 2px -2px 0 #0a0a12, -2px 2px 0 #0a0a12,
    4px 4px 0 #2bff88,
    5px 5px 0 #1a9e54;
}
.logo-dot{
  color:#2bff88;
  text-shadow:
    2px 0 0 #0a0a12, -2px 0 0 #0a0a12, 0 2px 0 #0a0a12, 0 -2px 0 #0a0a12,
    4px 4px 0 #0a5e2e;
  animation:pulseDot 1.4s infinite steps(2);
}
@keyframes pulseDot{
  0%,49%{ opacity:1; }
  50%,100%{ opacity:.45; }
}
.tagline{
  font-size:8px;
  letter-spacing:3px;
  color:#6b7a8a;
  margin-bottom:12px;
}

/* Main panel — bordered like an old arcade screen */
.panel{
  position:relative;
  background:#0a0a14;
  border:2px solid #2a2a44;
  padding:18px 22px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:
    inset 0 0 0 2px #05050a,
    inset 0 0 0 4px #14142a,
    0 6px 0 #05050a;
  min-width:260px;
}
/* Corner rivets */
.panel::before,
.panel::after{
  content:"";
  position:absolute;
  width:6px;height:6px;
  background:#2bff88;
  box-shadow:0 0 6px #2bff88;
}
.panel::before{ top:4px; left:4px; }
.panel::after { top:4px; right:4px; }

.panel .rivet-bl,
.panel .rivet-br{
  position:absolute;
  width:6px;height:6px;
  background:#2bff88;
  box-shadow:0 0 6px #2bff88;
}
.panel .rivet-bl{ bottom:4px; left:4px; }
.panel .rivet-br{ bottom:4px; right:4px; }

/* Section label */
.section-label{
  font-size:8px;
  color:#6b7a8a;
  letter-spacing:2px;
  margin-bottom:2px;
}

/* Buttons */
button{
  font-family:'Silkscreen', monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  color:#05050a;
  background:#ffd23f;
  border:none;
  padding:11px 20px;
  cursor:pointer;
  position:relative;
  box-shadow:
    inset -3px -3px 0 #b88c00,
    inset  3px  3px 0 #fff3a8,
    4px 4px 0 #05050a;
  transition:none;
  text-transform:uppercase;
  width:100%;
}
button:hover{ background:#ffe066; }
button:active{
  transform:translate(2px,2px);
  box-shadow:
    inset -3px -3px 0 #b88c00,
    inset  3px  3px 0 #fff3a8,
    2px 2px 0 #05050a;
}

button.green{
  background:#2bff88;
  box-shadow:
    inset -3px -3px 0 #0a7a3c,
    inset  3px  3px 0 #b0ffd0,
    4px 4px 0 #05050a;
}
button.green:hover{ background:#57ffa1; }
button.green:active{
  transform:translate(2px,2px);
  box-shadow:
    inset -3px -3px 0 #0a7a3c,
    inset  3px  3px 0 #b0ffd0,
    2px 2px 0 #05050a;
}

button.ghost{
  background:#14142a;
  color:#8a9aac;
  box-shadow:
    inset -3px -3px 0 #05050a,
    inset  3px  3px 0 #22223a,
    4px 4px 0 #05050a;
}
button.ghost:hover{ background:#1a1a32; color:#c8d8e8; }
button.ghost:active{
  transform:translate(2px,2px);
  box-shadow:
    inset -3px -3px 0 #05050a,
    inset  3px  3px 0 #22223a,
    2px 2px 0 #05050a;
}

button.small{ padding:9px 12px; font-size:9px; width:auto; }

/* Input */
input{
  font-family:'Silkscreen', monospace;
  font-size:16px;
  font-weight:700;
  letter-spacing:8px;
  text-align:center;
  text-transform:uppercase;
  color:#2bff88;
  background:#05050a;
  border:none;
  padding:10px 6px 10px 14px;
  outline:none;
  width:150px;
  box-shadow:
    inset 3px 3px 0 #000,
    inset 0 0 0 2px #2a2a44;
  caret-color:#2bff88;
}
input:focus{
  box-shadow:
    inset 3px 3px 0 #000,
    inset 0 0 0 2px #2bff88;
  color:#57ffa1;
}

/* Divider */
.divider{
  width:100%;
  height:2px;
  background:
    repeating-linear-gradient(90deg, #2a2a44 0 4px, transparent 4px 8px);
  margin:6px 0;
}

/* Room code display */
#roomCode{
  display:none;
  font-family:'Silkscreen', monospace;
  font-size:22px;
  font-weight:700;
  letter-spacing:8px;
  color:#2bff88;
  padding:8px 10px 8px 18px;
  background:#05050a;
  box-shadow:
    inset 3px 3px 0 #000,
    0 0 0 2px #2bff88,
    0 0 12px rgba(43,255,136,.4);
  text-shadow:0 0 8px #2bff88;
}

#status{
  font-size:8px;
  letter-spacing:1px;
  min-height:14px;
  color:#6b7a8a;
  text-align:center;
  line-height:1.5;
}
#status.err{ color:#ff5b5b; text-shadow:0 0 6px rgba(255,91,91,.5); }
#status.ok { color:#2bff88; text-shadow:0 0 6px rgba(43,255,136,.5); }

/* Hint bar */
#hint{
  position:absolute;
  top:8px;left:50%;
  transform:translateX(-50%);
  font-size:8px;
  color:#8a9aac;
  letter-spacing:1px;
  pointer-events:none;
  text-shadow:1px 1px 0 #000;
  z-index:3;
  padding:3px 8px;
  background:rgba(0,0,0,.55);
  border:1px solid #2a2a44;
}

/* Scoreboard */
#scoreboard{
  position:absolute;
  top:8px;left:50%;
  transform:translateX(-50%);
  display:none;
  gap:0;
  align-items:stretch;
  z-index:4;
  font-family:'Silkscreen', monospace;
  box-shadow:0 4px 0 rgba(0,0,0,.6);
  image-rendering:pixelated;
}
#scoreboard .team{
  padding:5px 10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  background:#0a0a14;
  color:#8a9aac;
  display:flex;align-items:center;gap:8px;
  border-top:2px solid #2a2a44;
  border-bottom:2px solid #2a2a44;
}
#scoreboard .team.left{
  border-left:2px solid #2a2a44;
  color:#ff5b5b;
}
#scoreboard .team.right{
  border-right:2px solid #2a2a44;
  color:#2bff88;
}
#scoreboard .team.you{
  background:#14142a;
}
#scoreboard .score{
  font-size:15px;
  font-weight:700;
  color:#fff;
  min-width:14px;
  text-align:center;
}
#scoreboard .vs{
  padding:5px 8px;
  background:#05050a;
  color:#6b7a8a;
  font-size:9px;
  display:flex;align-items:center;
  border-top:2px solid #2a2a44;
  border-bottom:2px solid #2a2a44;
}
#scoreboard .mode-pill{
  padding:5px 12px;
  background:#0a0a14;
  color:#ffd23f;
  font-size:10px;
  letter-spacing:2px;
  border:2px solid #2a2a44;
}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>

  <div id="hint" style="display:none;"></div>

  <div id="scoreboard">
    <!-- filled by JS -->
  </div>

  <div id="menu">
    <div class="logo-wrap">
      <div class="logo">Sondera<span class="logo-dot">.</span></div>
    </div>
    <div class="tagline">PIXEL FOOTBALL</div>

    <div class="panel">
      <div class="rivet-bl"></div>
      <div class="rivet-br"></div>

      <button id="singleBtn" class="green">PLAY SOLO</button>

      <div class="divider"></div>

      <div class="section-label">MULTIPLAYER</div>
      <button id="createBtn">CREATE ROOM</button>

      <div style="display:flex;gap:6px;align-items:center;justify-content:center;">
        <input id="roomInput" maxlength="6" placeholder="CODE" />
        <button id="joinBtn" class="ghost small">JOIN</button>
      </div>

      <div id="roomCode"></div>
      <div id="status"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* =========================
   SETUP
========================= */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const menu = document.getElementById('menu');
const singleBtn = document.getElementById('singleBtn');
const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');
const roomInput = document.getElementById('roomInput');
const roomCodeEl = document.getElementById('roomCode');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const scoreboardEl = document.getElementById('scoreboard');

const W = 320, H = 180;
const WALL = 10;
const GOAL_Y = H/2 - 24;
const GOAL_H = 48;
const GOAL_DEPTH = 18;

const WALLS = [
  { x:0, y:0, w:W, h:WALL },
  { x:0, y:H-WALL, w:W, h:WALL },
  { x:0, y:0, w:WALL, h:GOAL_Y },
  { x:0, y:GOAL_Y+GOAL_H, w:WALL, h:H-(GOAL_Y+GOAL_H) },
  { x:WALL-GOAL_DEPTH, y:GOAL_Y-2, w:2, h:GOAL_H+4 },
  { x:WALL-GOAL_DEPTH, y:GOAL_Y-2, w:GOAL_DEPTH, h:2 },
  { x:WALL-GOAL_DEPTH, y:GOAL_Y+GOAL_H, w:GOAL_DEPTH, h:2 },
  { x:W-WALL, y:0, w:WALL, h:GOAL_Y },
  { x:W-WALL, y:GOAL_Y+GOAL_H, w:WALL, h:H-(GOAL_Y+GOAL_H) },
  { x:W-WALL+GOAL_DEPTH, y:GOAL_Y-2, w:2, h:GOAL_H+4 },
  { x:W-WALL, y:GOAL_Y-2, w:GOAL_DEPTH, h:2 },
  { x:W-WALL, y:GOAL_Y+GOAL_H, w:GOAL_DEPTH, h:2 }
];

const POSTS = [
  { x:WALL, y:GOAL_Y, r:2.5 },
  { x:WALL, y:GOAL_Y+GOAL_H, r:2.5 },
  { x:W-WALL, y:GOAL_Y, r:2.5 },
  { x:W-WALL, y:GOAL_Y+GOAL_H, r:2.5 }
];

const GOALS = [
  { x:WALL-GOAL_DEPTH, y:GOAL_Y, w:GOAL_DEPTH, h:GOAL_H, color:'#ff5b5b', side:'left' },
  { x:W-WALL,          y:GOAL_Y, w:GOAL_DEPTH, h:GOAL_H, color:'#2bff88', side:'right' }
];

/* =========================
   STATE
========================= */

const MODE = { MENU: 0, SINGLE: 1, ONLINE: 2 };
let mode = MODE.MENU;

const socket = io();

let mySide = null;
let roomId = null;

let dispPlayers = [];
let dispBall = { x:W/2, y:H/2, r:4.5, vx:0, vy:0 };
let serverWon = false;

let scoreLeft = 0;
let scoreRight = 0;

let particles = [];
let shock = [];
let dashAfterimages = [];
let flash = 0;
let shake = 0;

let lastGoalId = 0;
let goalInfo = null;
let goalTimer = 0;

const keys = {};
let mouseX = W/2, mouseY = H/2;
let dashRequested = false;

/* =========================
   INPUT
========================= */

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(e.key === ' ' && mode !== MODE.MENU) dashRequested = true;
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });

cv.addEventListener('contextmenu', e=>e.preventDefault());
cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  mouseX = (e.clientX - r.left)/r.width * W;
  mouseY = (e.clientY - r.top)/r.height * H;
});
cv.addEventListener('mousedown', e=>{
  if(e.button === 2 && mode !== MODE.MENU){
    e.preventDefault();
    dashRequested = true;
  }
});

/* =========================
   SCOREBOARD
========================= */

function updateScoreboard(){
  if(mode === MODE.MENU){
    scoreboardEl.style.display = 'none';
    return;
  }

  scoreboardEl.style.display = 'flex';

  if(mode === MODE.SINGLE){
    scoreboardEl.innerHTML = `
      <div class="mode-pill">SOLO</div>
    `;
  } else {
    const mySideClass = mySide === 'left' ? 'you' : '';
    const oppSideClass = mySide === 'right' ? 'you' : '';
    scoreboardEl.innerHTML = `
      <div class="team left ${mySideClass}">
        <span>RED</span>
        <span class="score">${scoreLeft}</span>
      </div>
      <div class="vs">VS</div>
      <div class="team right ${oppSideClass}">
        <span class="score">${scoreRight}</span>
        <span>GRN</span>
      </div>
    `;
  }
}

/* =========================
   MENU HANDLERS
========================= */

singleBtn.addEventListener('click', ()=>{
  startSingleplayer();
});

createBtn.addEventListener('click', ()=>{
  socket.emit('createRoom');
});

joinBtn.addEventListener('click', ()=>{
  const code = roomInput.value.trim().toUpperCase();
  if(code.length < 4){
    setStatus('ENTER VALID CODE', true);
    return;
  }
  setStatus('');
  socket.emit('joinRoom', code);
});

roomInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') joinBtn.click();
});

function setStatus(msg, isErr){
  statusEl.textContent = msg;
  statusEl.classList.remove('err','ok');
  if(isErr) statusEl.classList.add('err');
  else if(msg) statusEl.classList.add('ok');
}

socket.on('roomJoined', ({ roomId: id, side })=>{
  roomId = id;
  mySide = side;

  roomCodeEl.style.display = 'block';
  roomCodeEl.textContent = id;
  setStatus('WAITING FOR PLAYER...');

  updateScoreboard();
});

socket.on('opponentJoined', ()=>{
  setStatus('STARTING...');
  setTimeout(()=>{
    menu.style.display = 'none';
    hintEl.style.display = 'block';
    hintEl.textContent = 'MOVE: WASD / ARROWS   ·   DASH: RIGHT-CLICK / SPACE';
    mode = MODE.ONLINE;
    updateScoreboard();
  }, 400);
});

socket.on('opponentLeft', ()=>{
  mode = MODE.MENU;
  mySide = null;
  roomId = null;
  menu.style.display = 'flex';
  hintEl.style.display = 'none';
  setStatus('OPPONENT LEFT', true);
  roomCodeEl.style.display = 'none';
  updateScoreboard();
});

socket.on('errorMsg', (msg)=>{
  setStatus(msg.toUpperCase(), true);
});

/* =========================
   SNAPSHOT
========================= */

let targetPlayers = [];
let targetBall = null;

socket.on('state', (st)=>{
  targetBall = st.ball;
  targetPlayers = st.players;
  serverWon = st.won;

  if(st.goal && st.goal.id !== lastGoalId){
    lastGoalId = st.goal.id;
    goalInfo = st.goal;
    goalTimer = 120;
    fireGoalExplosion(st.goal);

    if(st.goal.side === 'right'){
      // ball entered right goal → left player scored
      scoreLeft++;
    } else {
      scoreRight++;
    }
    updateScoreboard();
  }
});

/* =========================
   SINGLEPLAYER (free practice, no bot)
========================= */

let sp = null;

function startSingleplayer(){
  menu.style.display = 'none';
  hintEl.style.display = 'block';
  hintEl.textContent = 'MOVE: WASD / ARROWS   ·   DASH: RIGHT-CLICK / SPACE';
  mode = MODE.SINGLE;

  sp = {
    ball: { x: W/2, y: H/2, r: 4.5, vx:0, vy:0 },
    me: makeLocalPlayer('left'),
    won: false,
    winTimer: 0
  };

  lastGoalId = 0;
  goalInfo = null;
  updateScoreboard();
}

function makeLocalPlayer(side){
  return {
    side,
    x: side === 'left' ? W/2 - 40 : W/2 + 40,
    y: H/2,
    r: 5.5,
    vx: 0, vy: 0,
    facingX: side === 'left' ? 1 : -1,
    facingY: 0,
    walk: 0,
    flying: false,
    dashTimer: 0,
    dashCooldown: 0,
    dashX: 0, dashY: 0
  };
}

/* =========================
   PHYSICS HELPERS
========================= */

function clampCircleRect(c, r){
  const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
  const cy = Math.max(r.y, Math.min(c.y, r.y + r.h));
  let dx = c.x - cx, dy = c.y - cy;
  let d2 = dx*dx + dy*dy;

  if(d2 < c.r*c.r){
    let dist = Math.sqrt(d2);
    let nx, ny, pen;

    if(dist === 0){
      const l = c.x - r.x;
      const rt = (r.x + r.w) - c.x;
      const t = c.y - r.y;
      const b = (r.y + r.h) - c.y;
      const m = Math.min(l, rt, t, b);
      if(m === l){ nx=-1; ny=0; pen=l+c.r; }
      else if(m === rt){ nx=1; ny=0; pen=rt+c.r; }
      else if(m === t){ nx=0; ny=-1; pen=t+c.r; }
      else { nx=0; ny=1; pen=b+c.r; }
    } else {
      nx = dx/dist; ny = dy/dist; pen = c.r - dist;
    }

    c.x += nx*pen; c.y += ny*pen;
    const vn = c.vx*nx + c.vy*ny;
    if(vn < 0){
      c.vx -= 1.6*vn*nx;
      c.vy -= 1.6*vn*ny;
    }
  }
}

function collideCircles(c1, c2, rest = 1.0){
  const dx = c1.x - c2.x;
  const dy = c1.y - c2.y;
  const dist = Math.hypot(dx, dy);
  const min = c1.r + c2.r;

  if(dist < min && dist > 0){
    const nx = dx/dist, ny = dy/dist;
    const ov = min - dist;

    c1.x += nx*ov*.5; c1.y += ny*ov*.5;
    c2.x -= nx*ov*.5; c2.y -= ny*ov*.5;

    const vn = (c1.vx - c2.vx)*nx + (c1.vy - c2.vy)*ny;
    if(vn < 0){
      const im = -(1 + rest)*vn*.5;
      c1.vx += nx*im; c1.vy += ny*im;
      c2.vx -= nx*im; c2.vy -= ny*im;
    }
    return { hit:true };
  }
  return { hit:false };
}

function resolveWalls(body){
  for(const w of WALLS) clampCircleRect(body, w);
}

function bounceOffPost(b, p){
  const dx = b.x - p.x, dy = b.y - p.y;
  const d = Math.hypot(dx, dy);
  const m = b.r + p.r;
  if(d < m && d > 0){
    const nx = dx/d, ny = dy/d;
    b.x += nx*(m - d);
    b.y += ny*(m - d);
    const vn = b.vx*nx + b.vy*ny;
    if(vn < 0){
      b.vx -= 1.7*vn*nx;
      b.vy -= 1.7*vn*ny;
    }
  }
}

/* =========================
   DASH PARTICLES
========================= */

function burst(x, y, color, n){
  for(let i=0;i<n;i++){
    particles.push({
      x, y,
      vx:(Math.random()-.5)*4,
      vy:(Math.random()-.5)*4,
      life:18+Math.random()*12,
      c:color
    });
  }
  if(particles.length>220) particles.splice(0, particles.length-220);
}

/* =========================
   SINGLEPLAYER STEP
========================= */

function stepSingleplayer(){
  const SS = 3;
  const ACC = .38;
  const MAX = 2.2;

  const me = sp.me;

  if(me.dashCooldown > 0) me.dashCooldown--;
  if(me.dashTimer > 0) me.dashTimer--;

  if(dashRequested && me.dashCooldown <= 0 && !me.flying){
    let dx = mouseX - me.x, dy = mouseY - me.y;
    const d = Math.hypot(dx, dy);
    if(d >= 2){
      dx /= d; dy /= d;
      me.dashX = dx; me.dashY = dy;
      me.dashTimer = 7;
      me.dashCooldown = 180;
      me.facingX = dx; me.facingY = dy;
      me.vx = dx*6.5;
      me.vy = dy*6.5;
      me.walk += 1;

      burst(me.x - dx*3, me.y - dy*3, '#ffffff', 9);
      burst(me.x - dx*5, me.y - dy*5, '#ffd23f', 7);
      shake = Math.max(shake, 1.5);
    }
  }
  dashRequested = false;

  for(let s = 0; s < SS; s++){
    const p = me;
    const ix = (keys['a']||keys['arrowleft']?-1:0) + (keys['d']||keys['arrowright']?1:0);
    const iy = (keys['w']||keys['arrowup']?-1:0) + (keys['s']||keys['arrowdown']?1:0);

    if(p.dashTimer <= 0){
      p.vx += ix*ACC; p.vy += iy*ACC;
      p.vx *= .88; p.vy *= .88;
      const spd = Math.hypot(p.vx, p.vy);
      if(spd > MAX){ p.vx *= MAX/spd; p.vy *= MAX/spd; }
    } else {
      p.vx *= .93; p.vy *= .93;
    }

    if(Math.abs(ix) > .1 || Math.abs(iy) > .1){
      p.facingX = ix; p.facingY = iy;
      p.walk += Math.hypot(p.vx, p.vy)*.15;
    }

    // dash afterimages
    if(p.dashTimer > 0){
      dashAfterimages.push({
        x:p.x, y:p.y, life:8,
        facingX:p.facingX, facingY:p.facingY,
        side:p.side
      });
      if(dashAfterimages.length>14) dashAfterimages.shift();
    }

    p.x += p.vx/SS; p.y += p.vy/SS;
    resolveWalls(p);

    // ball
    sp.ball.vx *= Math.pow(.991, 1/SS);
    sp.ball.vy *= Math.pow(.991, 1/SS);
    sp.ball.x += sp.ball.vx/SS;
    sp.ball.y += sp.ball.vy/SS;

    for(const post of POSTS) bounceOffPost(sp.ball, post);

    const hit = collideCircles(p, sp.ball, .85);
    if(hit.hit && p.dashTimer > 0){
      sp.ball.vx += p.dashX * 0.45;
      sp.ball.vy += p.dashY * 0.45;

      for(const w of WALLS){
        const cx = Math.max(w.x, Math.min(sp.ball.x, w.x + w.w));
        const cy = Math.max(w.y, Math.min(sp.ball.y, w.y + w.h));
        const dx = sp.ball.x - cx;
        const dy = sp.ball.y - cy;
        const dist = Math.hypot(dx, dy);
        if(dist < sp.ball.r + 2 && dist > 0){
          const dashSpeed = Math.hypot(p.vx, p.vy);
          const pinchBoost = Math.min(1.5, dashSpeed*.28);
          sp.ball.vx += (dx/dist)*pinchBoost;
          sp.ball.vy += (dy/dist)*pinchBoost;
          burst(sp.ball.x, sp.ball.y, '#ffd23f', 8);
          break;
        }
      }
    }

    resolveWalls(sp.ball);
  }

  // goal
  if(!sp.won){
    for(const g of GOALS){
      if(
        sp.ball.x > g.x && sp.ball.x < g.x + g.w &&
        sp.ball.y > g.y + 2 && sp.ball.y < g.y + g.h - 2
      ){
        const speedKph = Math.round(Math.hypot(sp.ball.vx, sp.ball.vy)*28);
        sp.won = true;
        sp.winTimer = 120;

        lastGoalId++;
        goalInfo = {
          id: lastGoalId,
          side: g.side,
          color: g.color,
          speedKph,
          cx: g.x + g.w/2,
          cy: g.y + g.h/2
        };
        goalTimer = 120;
        fireGoalExplosion(goalInfo);
        break;
      }
    }
  }

  if(sp.won){
    if(--sp.winTimer <= 0){
      sp.ball = { x: W/2, y: H/2, r:4.5, vx:0, vy:0 };
      sp.me = makeLocalPlayer('left');
      sp.won = false;
      goalInfo = null;
    }
  }

  dispPlayers = [sp.me];
  dispBall = sp.ball;
  serverWon = sp.won;
}

/* =========================
   GOAL EXPLOSION (fires once)
========================= */

function fireGoalExplosion(g){
  flash = 1;
  shake = 10;

  shock.push({ x:g.cx, y:g.cy, t:0, color:g.color });

  const cols = [g.color, '#ffd23f', '#fff', '#ff8a00'];
  for(let i=0;i<90;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*5.5;
    particles.push({
      x: g.cx, y: g.cy,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      life: 25 + Math.random()*35,
      c: cols[i%4],
      s: 1 + ((Math.random()*3)|0)
    });
  }
}

/* =========================
   INTERPOLATION (online)
========================= */

function lerp(a, b, t){ return a + (b - a)*t; }

function interpolateOnline(){
  if(!targetPlayers.length) return;

  if(dispPlayers.length !== targetPlayers.length){
    dispPlayers = targetPlayers.map(p => ({
      side:p.side, x:p.x, y:p.y, r:p.r,
      facingX:p.facingX, facingY:p.facingY,
      walk:p.walk, flying:p.flying,
      dashCooldown:p.dashCooldown,
      dashTimer:0, dashX:0, dashY:0
    }));
  }

  const t = 0.5;

  for(let i=0;i<targetPlayers.length;i++){
    const src = targetPlayers[i];
    const dst = dispPlayers[i];

    // Dash trail — spawn if server says they're dashing
    if(src.dashTimer > 0){
      dashAfterimages.push({
        x:dst.x, y:dst.y, life:8,
        facingX:dst.facingX, facingY:dst.facingY,
        side:dst.side
      });
      if(dashAfterimages.length>14) dashAfterimages.shift();
    }

    dst.x = lerp(dst.x, src.x, t);
    dst.y = lerp(dst.y, src.y, t);
    dst.facingX = lerp(dst.facingX, src.facingX, t);
    dst.facingY = lerp(dst.facingY, src.facingY, t);
    dst.walk = lerp(dst.walk, src.walk, t);
    dst.flying = src.flying;
    dst.dashCooldown = src.dashCooldown;
    dst.side = src.side;
  }

  if(!dispBall) dispBall = { r:4.5, x:targetBall.x, y:targetBall.y, vx:0, vy:0 };
  dispBall.x = lerp(dispBall.x, targetBall.x, t);
  dispBall.y = lerp(dispBall.y, targetBall.y, t);
  dispBall.r = 4.5;
  dispBall.vx = targetBall.vx;
  dispBall.vy = targetBall.vy;
}

/* =========================
   INPUT SEND (60Hz, online)
========================= */

setInterval(()=>{
  if(mode !== MODE.ONLINE || !mySide) return;

  const ix = (keys['a']||keys['arrowleft']?-1:0) + (keys['d']||keys['arrowright']?1:0);
  const iy = (keys['w']||keys['arrowup']?-1:0) + (keys['s']||keys['arrowdown']?1:0);

  const payload = { ix, iy };

  if(dashRequested){
    payload.dash = true;
    payload.dashX = mouseX;
    payload.dashY = mouseY;
    dashRequested = false;
  }

  socket.emit('input', payload);
}, 1000/60);

/* =========================
   PITCH CACHE
========================= */

const pitchCache = document.createElement('canvas');
pitchCache.width = W; pitchCache.height = H;

function buildPitch(){
  const c = pitchCache.getContext('2d');
  let seed = 7;
  const rnd = () => (seed = (seed*16807)%2147483647) / 2147483647;

  c.fillStyle = '#14141d';
  c.fillRect(0,0,W,H);

  const crowd = ['#e63946','#f1faee','#ffd23f','#457b9d','#2a9d8f','#a8dadc','#c77dff'];

  for(let y=0;y<H;y+=2){
    for(let x=0;x<W;x+=2){
      if(x>=WALL && x<W-WALL && y>=WALL && y<H-WALL) continue;
      if(rnd() < .55){
        c.fillStyle = crowd[(rnd()*crowd.length)|0];
        c.globalAlpha = .35 + rnd()*.3;
        c.fillRect(x,y,1,1);
      }
    }
  }
  c.globalAlpha = 1;

  c.fillStyle = '#1f1f2e';
  c.fillRect(WALL-3, WALL-3, W-2*WALL+6, 3);
  c.fillRect(WALL-3, H-WALL, W-2*WALL+6, 3);

  const ads = ['#ffd23f','#e63946','#2bff88','#4cc9f0'];
  for(let x=WALL-3,i=0; x<W-WALL+3; x+=14,i++){
    c.fillStyle = ads[i%4];
    c.fillRect(x, WALL-3, 10, 2);
    c.fillRect(x, H-WALL+1, 10, 2);
  }

  const gx=WALL, gy=WALL, gw=W-2*WALL, gh=H-2*WALL;

  for(let i=0; i*20<gw; i++){
    c.fillStyle = i%2 ? '#1a4a1d' : '#215427';
    c.fillRect(gx+i*20, gy, 20, gh);
  }

  for(let i=0;i<900;i++){
    c.fillStyle = rnd()<.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.09)';
    c.fillRect(gx+((rnd()*gw)|0), gy+((rnd()*gh)|0), 1, 1);
  }

  const wear = (x,y,r)=>{
    const g = c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(120,90,40,.22)');
    g.addColorStop(1,'rgba(120,90,40,0)');
    c.fillStyle = g;
    c.fillRect(x-r,y-r,2*r,2*r);
  };
  wear(W/2,H/2,22); wear(WALL+6,H/2,22); wear(W-WALL-6,H/2,22);

  c.strokeStyle = 'rgba(255,255,255,.75)';
  c.lineWidth = 1;
  c.strokeRect(gx+.5, gy+.5, gw-1, gh-1);

  c.beginPath();
  c.moveTo(W/2+.5, gy);
  c.lineTo(W/2+.5, H-WALL);
  c.stroke();

  c.beginPath();
  c.arc(W/2+.5, H/2+.5, 22, 0, Math.PI*2);
  c.stroke();

  c.fillStyle = 'rgba(255,255,255,.85)';
  c.fillRect(W/2-1, H/2-1, 3, 3);

  const pH=68, pW=32, sH=30, sW=12;
  c.strokeRect(gx+.5, H/2-pH/2+.5, pW, pH);
  c.strokeRect(W-WALL-pW+.5, H/2-pH/2+.5, pW, pH);
  c.strokeRect(gx+.5, H/2-sH/2+.5, sW, sH);
  c.strokeRect(W-WALL-sW+.5, H/2-sH/2+.5, sW, sH);

  c.fillRect(gx+22, H/2, 2, 2);
  c.fillRect(W-WALL-24, H/2, 2, 2);

  c.beginPath();
  c.arc(gx+23, H/2+1, 12, -Math.acos(9/12), Math.acos(9/12));
  c.stroke();
  c.beginPath();
  c.arc(W-WALL-23, H/2+1, 12, Math.PI-Math.acos(9/12), Math.PI+Math.acos(9/12));
  c.stroke();

  for(const [x,y,a] of [[gx,gy,0],[W-WALL,gy,.5],[W-WALL,H-WALL,1],[gx,H-WALL,1.5]]){
    c.beginPath();
    c.arc(x+.5, y+.5, 4, a*Math.PI, (a+.5)*Math.PI);
    c.stroke();
  }

  const v = c.createRadialGradient(W/2,H/2,60, W/2,H/2,200);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,.35)');
  c.fillStyle = v;
  c.fillRect(0,0,W,H);
}
buildPitch();

/* =========================
   DRAW
========================= */

function drawPitch(){ ctx.drawImage(pitchCache, 0, 0); }

function drawGoals(){
  for(const g of GOALS){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(g.x, g.y, g.w, g.h);

    ctx.strokeStyle = 'rgba(240,240,240,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x=g.x; x<=g.x+g.w; x+=4){
      ctx.moveTo(x+.5, g.y);
      ctx.lineTo(x+.5, g.y+g.h);
    }
    for(let y=g.y; y<=g.y+g.h; y+=4){
      ctx.moveTo(g.x, y+.5);
      ctx.lineTo(g.x+g.w, y+.5);
    }
    ctx.stroke();

    ctx.strokeStyle = '#ccc';
    ctx.strokeRect(g.x+.5, g.y+.5, g.w-1, g.h-1);

    ctx.fillStyle = g.color;
    ctx.fillRect(g.x<W/2 ? g.x : g.x+g.w-1, g.y, 1, g.h);
  }

  ctx.fillStyle = '#fff';
  for(const p of POSTS){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#999';
    ctx.fillRect(p.x-1, p.y-1, 2, 2);
    ctx.fillStyle = '#fff';
  }
}

function drawBall(b){
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y+b.r+1, b.r, 2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(b.x|0, b.y|0, b.r, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#111';
  ctx.fillRect((b.x-1)|0, (b.y-1)|0, 3, 3);
  ctx.fillRect((b.x-3)|0, (b.y-2)|0, 2, 2);
  ctx.fillRect((b.x+2)|0, (b.y+1)|0, 2, 2);
}

function drawAfterimages(){
  for(const a of dashAfterimages){
    ctx.save();
    ctx.globalAlpha = (a.life/8) * .3;
    ctx.translate(a.x, a.y);
    ctx.rotate(Math.atan2(a.facingY, a.facingX));

    const c = a.side === 'left' ? '#ff5b5b' : '#2bff88';
    ctx.fillStyle = c;
    ctx.fillRect(-5, -5, 10, 10);

    ctx.globalAlpha = (a.life/8) * .5;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-3, -3, 6, 6);

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(p, isMe){
  const shirt = p.side === 'left' ? '#e63946' : '#2bff88';
  const shirtDark = p.side === 'left' ? '#d62828' : '#1fe07a';

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.atan2(p.facingY, p.facingX));

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 1, 6, 4, 0, 0, Math.PI*2);
  ctx.fill();

  const lo = Math.sin(p.walk*5)*2.5;

  ctx.fillStyle='#111';
  ctx.fillRect(-3+lo, -6, 3, 2);
  ctx.fillRect(-3-lo, 4, 3, 2);

  ctx.fillStyle='#f3b483';
  ctx.fillRect(-2+lo, -5, 2, 2);
  ctx.fillRect(-2-lo, 3, 2, 2);

  ctx.fillStyle='#fff';
  ctx.fillRect(-3, -5, 4, 3);
  ctx.fillRect(-3, 2, 4, 3);

  ctx.fillStyle = shirt;
  ctx.fillRect(-4, -4, 7, 8);

  ctx.fillStyle = shirtDark;
  ctx.fillRect(-4, -4, 2, 8);

  ctx.fillStyle='#f3b483';
  ctx.fillRect(-lo*.6, -6, 2, 2);
  ctx.fillRect(lo*.6, 4, 2, 2);

  ctx.beginPath();
  ctx.arc(0, 0, 3.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#3a2510';
  ctx.beginPath();
  ctx.arc(-1, 0, 3.2, Math.PI*.35, Math.PI*1.65);
  ctx.fill();

  ctx.fillStyle='#111';
  ctx.fillRect(1, -1.5, 1, 1);
  ctx.fillRect(1, .5, 1, 1);

  ctx.restore();

  if(isMe){
    ctx.save();
    ctx.globalAlpha = .55 + Math.sin(performance.now()*0.005)*.15;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawExplosion(){
  for(const sw of shock){
    const k = sw.t/40;

    if(sw.t < 12){
      ctx.globalAlpha = (1-sw.t/12)*.9;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, 6+sw.t*2.8, 0, Math.PI*2);
      ctx.fill();

      ctx.globalAlpha = (1-sw.t/12)*.6;
      ctx.fillStyle = sw.color;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, 10+sw.t*4, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.globalAlpha = 1-k;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 5*(1-k)+1;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, k*100, 0, Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle='#fff';
    ctx.lineWidth = 2*(1-k)+.5;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, k*62, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawGoalText(){
  if(!goalInfo) return;

  const t = 120 - goalTimer;
  const out = Math.min(1, goalTimer/20);

  const sc = t<12 ? t/12*1.4
           : t<20 ? 1.4-(t-12)/8*.4
           : 1 + Math.sin(t*.15)*.02;

  ctx.save();
  ctx.globalAlpha = out;
  ctx.translate(W/2, H/2-16);
  ctx.rotate(-.06);
  ctx.scale(sc, sc);

  const col = goalInfo.color;
  const bw = Math.min(1, t/10)*(W+40);

  ctx.fillStyle = col;
  ctx.globalAlpha = out*.55;
  ctx.fillRect(-bw/2, -19, bw, 38);

  ctx.globalAlpha = out;
  ctx.fillStyle = '#fff';
  ctx.fillRect(-bw/2, -19, bw, 1);
  ctx.fillRect(-bw/2, 18, bw, 1);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.font = '900 34px monospace';

  ctx.lineWidth = 7;
  ctx.strokeStyle = '#000';
  ctx.strokeText('GOAL!', 0, 0);

  ctx.lineWidth = 4;
  ctx.strokeStyle = col;
  ctx.strokeText('GOAL!', 0, 0);

  const gr = ctx.createLinearGradient(0,-16,0,16);
  gr.addColorStop(0,'#fff');
  gr.addColorStop(1,'#ffd23f');
  ctx.fillStyle = gr;
  ctx.fillText('GOAL!', 0, 0);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = out * Math.min(1, Math.max(0, (t-10)/8));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 13px monospace';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.strokeText(goalInfo.speedKph + ' kph', W/2, H/2 + 16);
  ctx.fillStyle = '#fff';
  ctx.fillText(goalInfo.speedKph + ' kph', W/2, H/2 + 16);
  ctx.restore();
}

function drawDashUI(){
  let me = null;
  if(mode === MODE.SINGLE) me = dispPlayers.find(p => p.side === 'left');
  else if(mode === MODE.ONLINE) me = dispPlayers.find(p => p.side === mySide);
  if(!me) return;

  const maxCD = 180;
  const ready = me.dashCooldown <= 0;
  const p = ready ? 1 : 1 - (me.dashCooldown / maxCD);

  const cx = 24, cy = H - 24, R = 9;

  ctx.save();

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.arc(cx, cy, R+3, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.stroke();

  const startAngle = -Math.PI/2;
  const endAngle = startAngle + Math.PI*2*p;

  ctx.strokeStyle = ready ? '#2bff88' : '#ffd23f';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, R, startAngle, endAngle);
  ctx.stroke();

  if(ready){
    ctx.globalAlpha = 0.35 + Math.sin(performance.now()*0.006)*0.15;
    ctx.fillStyle = '#2bff88';
    ctx.beginPath();
    ctx.arc(cx, cy, R-3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = ready ? '#0a0a0a' : 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.moveTo(cx+1,  cy-5);
  ctx.lineTo(cx-2,  cy+0.5);
  ctx.lineTo(cx+0.5,cy+0.5);
  ctx.lineTo(cx-1,  cy+5);
  ctx.lineTo(cx+3,  cy-1);
  ctx.lineTo(cx+0.5,cy-1);
  ctx.closePath();
  ctx.fill();

  ctx.font = 'bold 6px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = ready ? '#2bff88' : 'rgba(255,255,255,0.55)';
  ctx.fillText(ready ? 'READY' : 'DASH', cx, cy + R + 8);

  ctx.restore();
}

/* =========================
   RENDER
========================= */

function render(){
  ctx.save();

  if(shake > .3){
    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  drawPitch();
  drawGoals();

  if(!serverWon){
    drawBall(dispBall);
  }

  for(const p of particles){
    ctx.globalAlpha = Math.min(1, p.life/20);
    ctx.fillStyle = p.c;
    const z = p.s || 2;
    ctx.fillRect(p.x|0, p.y|0, z, z);
    ctx.globalAlpha = 1;
  }

  drawExplosion();
  drawAfterimages();

  for(const p of dispPlayers){
    const isMe =
      (mode === MODE.SINGLE && p.side === 'left') ||
      (mode === MODE.ONLINE && p.side === mySide);
    drawPlayer(p, isMe);
  }

  ctx.restore();

  if(flash > .02){
    ctx.globalAlpha = flash*.65;
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

  drawDashUI();

  if(serverWon){
    drawGoalText();
  }
}

/* =========================
   LOOP
========================= */

let acc = 0;
let last = performance.now();

function loop(now){
  let dt = (now - last)/1000;
  last = now;
  if(dt > .05) dt = .05;
  acc += dt;

  while(acc > 1/60){
    if(mode === MODE.ONLINE) interpolateOnline();
    else if(mode === MODE.SINGLE) stepSingleplayer();

    flash *= .88;
    shake *= .9;
    for(const sw of shock) sw.t++;
    shock = shock.filter(sw => sw.t < 40);

    for(let i=particles.length-1; i>=0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= .93; p.vy *= .93;
      if(--p.life <= 0) particles.splice(i, 1);
    }

    for(let i=dashAfterimages.length-1; i>=0; i--){
      dashAfterimages[i].life--;
      if(dashAfterimages[i].life <= 0) dashAfterimages.splice(i,1);
    }

    if(goalTimer > 0) goalTimer--;

    acc -= 1/60;
  }

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

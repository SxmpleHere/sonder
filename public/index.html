<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Physics Football — Online</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#09090e;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:'Press Start 2P', monospace;
  color:#fff;
  image-rendering:pixelated;
}
#wrap{
  position:relative;
  width:min(98vw,1000px);
  aspect-ratio:16/9;
  border:4px solid #1f1f2e;
  box-shadow:0 0 0 4px #08080c,0 0 50px rgba(0,0,0,.9);
  background:#153317;
  border-radius:8px;
  overflow:hidden;
}
canvas{
  width:100%;height:100%;display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* ===========================
   PIXEL UI
=========================== */

#menu{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(5,5,10,.94);
  gap:16px;
  padding:20px;
  text-align:center;
}

#menu h1{
  font-size:18px;
  letter-spacing:2px;
  color:#ffd23f;
  text-shadow:3px 3px 0 #000, -1px -1px 0 #7a5500;
  margin-bottom:4px;
  animation:twinkle 2s infinite;
}
@keyframes twinkle{
  0%,100%{ color:#ffd23f; }
  50%{ color:#fff8b0; }
}

#menu .sub{
  font-size:7px;
  opacity:.75;
  line-height:1.9;
  max-width:520px;
  color:#c9d8b8;
}

#menu .panel{
  background:#0d0d14;
  border:3px solid #2a2a3a;
  box-shadow:inset 0 0 0 2px #050508;
  padding:14px 18px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  image-rendering:pixelated;
}

#menu input{
  background:#000;
  border:3px solid #2a2a3a;
  color:#2bff88;
  padding:10px 12px;
  font-family:'Press Start 2P', monospace;
  font-size:12px;
  text-align:center;
  letter-spacing:5px;
  text-transform:uppercase;
  border-radius:0;
  width:180px;
  outline:none;
  box-shadow:inset 2px 2px 0 #050508;
}
#menu input:focus{ border-color:#2bff88; }

button{
  background:#ffd23f;
  color:#000;
  border:3px solid #7a5500;
  padding:10px 18px;
  font-family:'Press Start 2P', monospace;
  font-size:10px;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:0;
  box-shadow:
    inset -3px -3px 0 #b8942a,
    inset 3px 3px 0 #fff3b0,
    0 4px 0 #000;
  transition:transform .05s;
  image-rendering:pixelated;
  text-transform:uppercase;
}
button:hover{ background:#ffe066; }
button:active{
  transform:translateY(2px);
  box-shadow:
    inset -3px -3px 0 #b8942a,
    inset 3px 3px 0 #fff3b0,
    0 2px 0 #000;
}
button.secondary{
  background:#2bff88;
  border-color:#127a42;
  box-shadow:
    inset -3px -3px 0 #1cbb65,
    inset 3px 3px 0 #a8ffd0,
    0 4px 0 #000;
}
button.secondary:hover{ background:#57ffa1; }
button.ghost{
  background:transparent;
  color:#2bff88;
  border-color:#2bff88;
  box-shadow:none;
}
button.ghost:hover{ background:rgba(43,255,136,.1); }
button.ghost:active{ transform:translateY(2px); box-shadow:none; }

.row{ display:flex; gap:8px; align-items:center; }

#roomCode{
  font-size:18px;
  font-weight:bold;
  color:#2bff88;
  letter-spacing:8px;
  text-shadow:2px 2px 0 #000, -1px -1px 0 #0a5e2e;
  padding:8px 14px;
  background:#000;
  border:3px solid #2bff88;
  box-shadow:inset 2px 2px 0 #050508;
}

#status{
  font-size:7px;
  opacity:.8;
  min-height:14px;
  color:#ffd23f;
}
#status.err{ color:#ff4b4b; }

#hint{
  position:absolute;
  top:8px;left:50%;
  transform:translateX(-50%);
  font-size:6px;
  color:#fff;
  opacity:.7;
  pointer-events:none;
  text-shadow:1px 1px 0 #000;
  letter-spacing:1px;
}

#banner{
  position:absolute;
  bottom:8px;left:50%;
  transform:translateX(-50%);
  font-size:6px;
  padding:4px 8px;
  background:#000;
  border:2px solid #ffd23f;
  color:#ffd23f;
  text-shadow:1px 1px 0 #000;
  pointer-events:none;
  letter-spacing:1px;
}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="hint"></div>
  <div id="banner" style="display:none;"></div>

  <div id="menu">
    <h1>PIXEL FOOTBALL</h1>
    <div class="sub">WASD / ARROWS = MOVE &middot; RIGHT CLICK = DASH<br>FIRST TO SCORE WINS THE ROUND</div>

    <div class="panel">
      <button id="singleBtn" class="secondary">SINGLE PLAYER</button>
      <button id="createBtn">CREATE ROOM</button>
      <div class="row">
        <input id="roomInput" maxlength="6" placeholder="CODE" />
        <button id="joinBtn" class="ghost">JOIN</button>
      </div>
      <div id="roomCode" style="display:none;"></div>
      <div id="status"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* =========================
   SETUP
========================= */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const menu = document.getElementById('menu');
const singleBtn = document.getElementById('singleBtn');
const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');
const roomInput = document.getElementById('roomInput');
const roomCodeEl = document.getElementById('roomCode');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const bannerEl = document.getElementById('banner');

const W = 320, H = 180;
const WALL = 10;
const GOAL_Y = H/2 - 24;
const GOAL_H = 48;
const GOAL_DEPTH = 18;

const WALLS = [
  { x:0, y:0, w:W, h:WALL },
  { x:0, y:H-WALL, w:W, h:WALL },
  { x:0, y:0, w:WALL, h:GOAL_Y },
  { x:0, y:GOAL_Y+GOAL_H, w:WALL, h:H-(GOAL_Y+GOAL_H) },
  { x:WALL-GOAL_DEPTH, y:GOAL_Y-2, w:2, h:GOAL_H+4 },
  { x:WALL-GOAL_DEPTH, y:GOAL_Y-2, w:GOAL_DEPTH, h:2 },
  { x:WALL-GOAL_DEPTH, y:GOAL_Y+GOAL_H, w:GOAL_DEPTH, h:2 },
  { x:W-WALL, y:0, w:WALL, h:GOAL_Y },
  { x:W-WALL, y:GOAL_Y+GOAL_H, w:WALL, h:H-(GOAL_Y+GOAL_H) },
  { x:W-WALL+GOAL_DEPTH, y:GOAL_Y-2, w:2, h:GOAL_H+4 },
  { x:W-WALL, y:GOAL_Y-2, w:GOAL_DEPTH, h:2 },
  { x:W-WALL, y:GOAL_Y+GOAL_H, w:GOAL_DEPTH, h:2 }
];

const POSTS = [
  { x:WALL, y:GOAL_Y, r:2.5 },
  { x:WALL, y:GOAL_Y+GOAL_H, r:2.5 },
  { x:W-WALL, y:GOAL_Y, r:2.5 },
  { x:W-WALL, y:GOAL_Y+GOAL_H, r:2.5 }
];

const GOALS = [
  { x:WALL-GOAL_DEPTH, y:GOAL_Y, w:GOAL_DEPTH, h:GOAL_H, color:'#ff4b4b', side:'left' },
  { x:W-WALL,          y:GOAL_Y, w:GOAL_DEPTH, h:GOAL_H, color:'#2bff88', side:'right' }
];

/* =========================
   STATE
========================= */

const MODE = { MENU: 0, SINGLE: 1, ONLINE: 2 };
let mode = MODE.MENU;

const socket = io();

let mySide = null;
let roomId = null;

// Local display state
let dispPlayers = [];
let dispBall = { x:W/2, y:H/2, r:4.5, vx:0, vy:0 };
let myPlayerLocal = null;  // local prediction copy for singleplayer
let serverWon = false;

let particles = [];
let shock = [];
let flash = 0;
let shake = 0;

let lastGoalId = 0;        // dedupes goal explosions
let goalInfo = null;
let goalTimer = 0;

const keys = {};
let mouseX = W/2, mouseY = H/2;
let dashRequested = false;

/* =========================
   INPUT
========================= */

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(e.key === ' ' && (mode !== MODE.MENU)) dashRequested = true;
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });

cv.addEventListener('contextmenu', e=>e.preventDefault());
cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  mouseX = (e.clientX - r.left)/r.width * W;
  mouseY = (e.clientY - r.top)/r.height * H;
});
cv.addEventListener('mousedown', e=>{
  if(e.button === 2 && mode !== MODE.MENU){
    e.preventDefault();
    dashRequested = true;
  }
});

/* =========================
   MENU HANDLERS
========================= */

singleBtn.addEventListener('click', ()=>{
  startSingleplayer();
});

createBtn.addEventListener('click', ()=>{
  socket.emit('createRoom');
});

joinBtn.addEventListener('click', ()=>{
  const code = roomInput.value.trim().toUpperCase();
  if(code.length < 4){
    statusEl.textContent = 'ENTER VALID CODE';
    statusEl.classList.add('err');
    return;
  }
  statusEl.classList.remove('err');
  socket.emit('joinRoom', code);
});

roomInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') joinBtn.click();
});

socket.on('roomJoined', ({ roomId: id, side })=>{
  roomId = id;
  mySide = side;

  roomCodeEl.style.display = 'block';
  roomCodeEl.textContent = id;
  statusEl.textContent = 'WAITING FOR PLAYER 2...';
  statusEl.classList.remove('err');

  hintEl.textContent =
    side === 'left' ? 'YOU = RED (LEFT)  ·  RMB = DASH'
                    : 'YOU = GREEN (RIGHT)  ·  RMB = DASH';
});

socket.on('opponentJoined', ()=>{
  statusEl.textContent = 'STARTING...';
  setTimeout(()=>{ menu.style.display = 'none'; mode = MODE.ONLINE; }, 400);
});

socket.on('opponentLeft', ()=>{
  mode = MODE.MENU;
  mySide = null;
  roomId = null;
  menu.style.display = 'flex';
  statusEl.textContent = 'OPPONENT LEFT. WAITING...';
  statusEl.classList.add('err');
  roomCodeEl.style.display = 'none';
  bannerEl.style.display = 'none';
});

socket.on('errorMsg', (msg)=>{
  statusEl.textContent = msg.toUpperCase();
  statusEl.classList.add('err');
});

/* =========================
   SNAPSHOT HANDLING (from server)
========================= */

let targetPlayers = [];
let targetBall = null;

socket.on('state', (st)=>{
  targetBall = st.ball;
  targetPlayers = st.players;
  serverWon = st.won;

  // Goal detection by unique id — fires only once per goal
  if(st.goal && st.goal.id !== lastGoalId){
    lastGoalId = st.goal.id;
    goalInfo = st.goal;
    goalTimer = 120;
    fireGoalExplosion(st.goal);
  }
});

/* =========================
   SINGLEPLAYER
========================= */

let sp = null;

function startSingleplayer(){
  menu.style.display = 'none';
  mode = MODE.SINGLE;

  sp = {
    ball: { x: W/2, y: H/2, r: 4.5, vx:0, vy:0 },
    me: makeLocalPlayer('left'),
    bot: makeLocalPlayer('right'),
    won: false,
    winTimer: 0
  };

  hintEl.textContent = 'SINGLE PLAYER  ·  MOVE: WASD  ·  DASH: RMB / SPACE';
  bannerEl.style.display = 'block';
  bannerEl.textContent = 'SINGLE PLAYER';
  lastGoalId = 0;
  goalInfo = null;
}

function makeLocalPlayer(side){
  return {
    side,
    x: side === 'left' ? W/2 - 40 : W/2 + 40,
    y: H/2,
    r: 5.5,
    vx: 0, vy: 0,
    facingX: side === 'left' ? 1 : -1,
    facingY: 0,
    walk: 0,
    flying: false,
    dashTimer: 0,
    dashCooldown: 0,
    dashX: 0, dashY: 0
  };
}

/* =========================
   CLIENT-SIDE PHYSICS
   (mirrored so prediction & SP share code)
========================= */

function clampCircleRect(c, r){
  const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
  const cy = Math.max(r.y, Math.min(c.y, r.y + r.h));
  let dx = c.x - cx, dy = c.y - cy;
  let d2 = dx*dx + dy*dy;

  if(d2 < c.r*c.r){
    let dist = Math.sqrt(d2);
    let nx, ny, pen;

    if(dist === 0){
      const l = c.x - r.x;
      const rt = (r.x + r.w) - c.x;
      const t = c.y - r.y;
      const b = (r.y + r.h) - c.y;
      const m = Math.min(l, rt, t, b);
      if(m === l){ nx=-1; ny=0; pen=l+c.r; }
      else if(m === rt){ nx=1; ny=0; pen=rt+c.r; }
      else if(m === t){ nx=0; ny=-1; pen=t+c.r; }
      else { nx=0; ny=1; pen=b+c.r; }
    } else {
      nx = dx/dist; ny = dy/dist; pen = c.r - dist;
    }

    c.x += nx*pen; c.y += ny*pen;
    const vn = c.vx*nx + c.vy*ny;
    if(vn < 0){
      c.vx -= 1.6*vn*nx;
      c.vy -= 1.6*vn*ny;
    }
  }
}

function collideCircles(c1, c2, rest = 1.0){
  const dx = c1.x - c2.x;
  const dy = c1.y - c2.y;
  const dist = Math.hypot(dx, dy);
  const min = c1.r + c2.r;

  if(dist < min && dist > 0){
    const nx = dx/dist, ny = dy/dist;
    const ov = min - dist;

    c1.x += nx*ov*.5; c1.y += ny*ov*.5;
    c2.x -= nx*ov*.5; c2.y -= ny*ov*.5;

    const vn = (c1.vx - c2.vx)*nx + (c1.vy - c2.vy)*ny;
    if(vn < 0){
      const im = -(1 + rest)*vn*.5;
      c1.vx += nx*im; c1.vy += ny*im;
      c2.vx -= nx*im; c2.vy -= ny*im;
    }
    return { hit:true };
  }
  return { hit:false };
}

function resolveWalls(body){
  for(const w of WALLS) clampCircleRect(body, w);
}

function bounceOffPost(b, p){
  const dx = b.x - p.x, dy = b.y - p.y;
  const d = Math.hypot(dx, dy);
  const m = b.r + p.r;
  if(d < m && d > 0){
    const nx = dx/d, ny = dy/d;
    b.x += nx*(m - d);
    b.y += ny*(m - d);
    const vn = b.vx*nx + b.vy*ny;
    if(vn < 0){
      b.vx -= 1.7*vn*nx;
      b.vy -= 1.7*vn*ny;
    }
  }
}

/* =========================
   AI for singleplayer bot
========================= */

function updateBot(bot, ball){
  // Simple: chase the ball, dash occasionally
  const dx = ball.x - bot.x;
  const dy = ball.y - bot.y;
  const d = Math.hypot(dx, dy);

  // Always try to stay between ball and own goal when defending
  let tx = ball.x, ty = ball.y;

  // Aim slightly to push ball into left goal
  tx -= 6;
  ty += Math.sin(performance.now()*0.002)*4;

  let ix = 0, iy = 0;
  if(Math.abs(tx - bot.x) > 3) ix = Math.sign(tx - bot.x);
  if(Math.abs(ty - bot.y) > 3) iy = Math.sign(ty - bot.y);

  return { ix, iy };
}

/* =========================
   SINGLEPLAYER STEP
========================================================= */

function stepSingleplayer(){
  const SS = 3;
  const ACC = .38;
  const MAX = 2.2;

  const me = sp.me;

  if(me.dashCooldown > 0) me.dashCooldown--;
  if(me.dashTimer > 0) me.dashTimer--;

  // Dash
  if(dashRequested && me.dashCooldown <= 0 && !me.flying){
    let dx = mouseX - me.x, dy = mouseY - me.y;
    const d = Math.hypot(dx, dy);
    if(d >= 2){
      dx /= d; dy /= d;
      me.dashX = dx; me.dashY = dy;
      me.dashTimer = 7;
      me.dashCooldown = 180;
      me.facingX = dx; me.facingY = dy;
      me.vx = dx*6.5;
      me.vy = dy*6.5;
      me.walk += 1;
    }
  }
  dashRequested = false;

  // Bot dash logic
  const bot = sp.bot;
  if(bot.dashCooldown > 0) bot.dashCooldown--;
  if(bot.dashTimer > 0) bot.dashTimer--;

  const bdx = sp.ball.x - bot.x;
  const bdy = sp.ball.y - bot.y;
  const bd = Math.hypot(bdx, bdy);

  if(bot.dashCooldown <= 0 && bd < 40 && bd > 8 && Math.random() < 0.02){
    const dx = bdx/bd, dy = bdy/bd;
    bot.dashX = dx; bot.dashY = dy;
    bot.dashTimer = 7;
    bot.dashCooldown = 180;
    bot.facingX = dx; bot.facingY = dy;
    bot.vx = dx*6.5;
    bot.vy = dy*6.5;
    bot.walk += 1;
  }

  const botInput = updateBot(bot, sp.ball);

  for(let s = 0; s < SS; s++){
    // me
    {
      const p = me;
      const ix = (keys['a']||keys['arrowleft']?-1:0) + (keys['d']||keys['arrowright']?1:0);
      const iy = (keys['w']||keys['arrowup']?-1:0) + (keys['s']||keys['arrowdown']?1:0);

      if(p.dashTimer <= 0){
        p.vx += ix*ACC; p.vy += iy*ACC;
        p.vx *= .88; p.vy *= .88;
        const spd = Math.hypot(p.vx, p.vy);
        if(spd > MAX){ p.vx *= MAX/spd; p.vy *= MAX/spd; }
      } else {
        p.vx *= .93; p.vy *= .93;
      }

      if(Math.abs(ix) > .1 || Math.abs(iy) > .1){
        p.facingX = ix; p.facingY = iy;
        p.walk += Math.hypot(p.vx, p.vy)*.15;
      }

      p.x += p.vx/SS; p.y += p.vy/SS;
      resolveWalls(p);
    }

    // bot
    {
      const p = bot;
      const ix = botInput.ix, iy = botInput.iy;

      if(p.dashTimer <= 0){
        p.vx += ix*ACC*.75; p.vy += iy*ACC*.75;
        p.vx *= .88; p.vy *= .88;
        const spd = Math.hypot(p.vx, p.vy);
        if(spd > MAX){ p.vx *= MAX/spd; p.vy *= MAX/spd; }
      } else {
        p.vx *= .93; p.vy *= .93;
      }

      if(Math.abs(ix) > .1 || Math.abs(iy) > .1){
        p.facingX = ix; p.facingY = iy;
        p.walk += Math.hypot(p.vx, p.vy)*.15;
      }

      p.x += p.vx/SS; p.y += p.vy/SS;
      resolveWalls(p);
    }

    // ball
    sp.ball.vx *= Math.pow(.991, 1/SS);
    sp.ball.vy *= Math.pow(.991, 1/SS);
    sp.ball.x += sp.ball.vx/SS;
    sp.ball.y += sp.ball.vy/SS;

    for(const post of POSTS) bounceOffPost(sp.ball, post);

    // collisions
    for(const p of [me, bot]){
      const hit = collideCircles(p, sp.ball, .85);
      if(hit.hit && p.dashTimer > 0){
        sp.ball.vx += p.dashX * 0.45;
        sp.ball.vy += p.dashY * 0.45;

        for(const w of WALLS){
          const cx = Math.max(w.x, Math.min(sp.ball.x, w.x + w.w));
          const cy = Math.max(w.y, Math.min(sp.ball.y, w.y + w.h));
          const dx = sp.ball.x - cx;
          const dy = sp.ball.y - cy;
          const dist = Math.hypot(dx, dy);
          if(dist < sp.ball.r + 2 && dist > 0){
            const dashSpeed = Math.hypot(p.vx, p.vy);
            const pinchBoost = Math.min(1.5, dashSpeed*.28);
            sp.ball.vx += (dx/dist)*pinchBoost;
            sp.ball.vy += (dy/dist)*pinchBoost;
            break;
          }
        }
      }
    }

    resolveWalls(sp.ball);
  }

  // goal
  for(const g of GOALS){
    if(
      sp.ball.x > g.x && sp.ball.x < g.x + g.w &&
      sp.ball.y > g.y + 2 && sp.ball.y < g.y + g.h - 2
    ){
      const speedKph = Math.round(Math.hypot(sp.ball.vx, sp.ball.vy)*28);
      sp.won = true;
      sp.winTimer = 120;

      lastGoalId++;
      goalInfo = {
        id: lastGoalId,
        side: g.side,
        color: g.color,
        speedKph,
        cx: g.x + g.w/2,
        cy: g.y + g.h/2
      };
      goalTimer = 120;
      fireGoalExplosion(goalInfo);
      break;
    }
  }

  // Reset
  if(sp.won){
    if(--sp.winTimer <= 0){
      sp.ball = { x: W/2, y: H/2, r:4.5, vx:0, vy:0 };
      sp.me = makeLocalPlayer('left');
      sp.bot = makeLocalPlayer('right');
      sp.won = false;
      goalInfo = null;
    }
  }

  // Export for render
  dispPlayers = [sp.me, sp.bot];
  dispBall = sp.ball;
  serverWon = sp.won;
}

/* =========================
   GOAL EXPLOSION (fires once per goal id)
========================= */

function fireGoalExplosion(g){
  flash = 1;
  shake = 10;

  shock.push({ x:g.cx, y:g.cy, t:0, color:g.color });

  const cols = [g.color, '#ffd23f', '#fff', '#ff8a00'];
  for(let i=0;i<90;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*5.5;
    particles.push({
      x: g.cx,
      y: g.cy,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      life: 25 + Math.random()*35,
      c: cols[i%4],
      s: 1 + ((Math.random()*3)|0)
    });
  }
}

/* =========================
   INTERPOLATION (online)
========================= */

function lerp(a, b, t){ return a + (b - a)*t; }

function interpolateOnline(){
  if(!targetPlayers.length) return;

  if(dispPlayers.length !== targetPlayers.length){
    dispPlayers = targetPlayers.map(p => ({
      side:p.side, x:p.x, y:p.y, r:p.r,
      facingX:p.facingX, facingY:p.facingY,
      walk:p.walk, flying:p.flying,
      dashCooldown:p.dashCooldown,
      dashTimer:0, dashX:0, dashY:0
    }));
  }

  const t = 0.5;  // snappier interpolation (was 0.35)

  for(let i=0;i<targetPlayers.length;i++){
    const src = targetPlayers[i];
    const dst = dispPlayers[i];
    dst.x = lerp(dst.x, src.x, t);
    dst.y = lerp(dst.y, src.y, t);
    dst.facingX = lerp(dst.facingX, src.facingX, t);
    dst.facingY = lerp(dst.facingY, src.facingY, t);
    dst.walk = lerp(dst.walk, src.walk, t);
    dst.flying = src.flying;
    dst.dashCooldown = src.dashCooldown;
    dst.side = src.side;
  }

  if(!dispBall) dispBall = { r:4.5, x:targetBall.x, y:targetBall.y, vx:0, vy:0 };
  dispBall.x = lerp(dispBall.x, targetBall.x, t);
  dispBall.y = lerp(dispBall.y, targetBall.y, t);
  dispBall.r = 4.5;
  dispBall.vx = targetBall.vx;
  dispBall.vy = targetBall.vy;
}

/* =========================
   INPUT SEND (60Hz, online)
========================= */

setInterval(()=>{
  if(mode !== MODE.ONLINE || !mySide) return;

  const ix = (keys['a']||keys['arrowleft']?-1:0) + (keys['d']||keys['arrowright']?1:0);
  const iy = (keys['w']||keys['arrowup']?-1:0) + (keys['s']||keys['arrowdown']?1:0);

  const payload = { ix, iy };

  if(dashRequested){
    payload.dash = true;
    payload.dashX = mouseX;
    payload.dashY = mouseY;
    dashRequested = false;
  }

  socket.emit('input', payload);
}, 1000/60);

/* =========================
   PITCH CACHE
========================= */

const pitchCache = document.createElement('canvas');
pitchCache.width = W; pitchCache.height = H;

function buildPitch(){
  const c = pitchCache.getContext('2d');
  let seed = 7;
  const rnd = () => (seed = (seed*16807)%2147483647) / 2147483647;

  c.fillStyle = '#14141d';
  c.fillRect(0,0,W,H);

  const crowd = ['#e63946','#f1faee','#ffd23f','#457b9d','#2a9d8f','#a8dadc','#c77dff'];

  for(let y=0;y<H;y+=2){
    for(let x=0;x<W;x+=2){
      if(x>=WALL && x<W-WALL && y>=WALL && y<H-WALL) continue;
      if(rnd() < .55){
        c.fillStyle = crowd[(rnd()*crowd.length)|0];
        c.globalAlpha = .35 + rnd()*.3;
        c.fillRect(x,y,1,1);
      }
    }
  }
  c.globalAlpha = 1;

  c.fillStyle = '#1f1f2e';
  c.fillRect(WALL-3, WALL-3, W-2*WALL+6, 3);
  c.fillRect(WALL-3, H-WALL, W-2*WALL+6, 3);

  const ads = ['#ffd23f','#e63946','#2bff88','#4cc9f0'];
  for(let x=WALL-3,i=0; x<W-WALL+3; x+=14,i++){
    c.fillStyle = ads[i%4];
    c.fillRect(x, WALL-3, 10, 2);
    c.fillRect(x, H-WALL+1, 10, 2);
  }

  const gx=WALL, gy=WALL, gw=W-2*WALL, gh=H-2*WALL;

  for(let i=0; i*20<gw; i++){
    c.fillStyle = i%2 ? '#1a4a1d' : '#215427';
    c.fillRect(gx+i*20, gy, 20, gh);
  }

  for(let i=0;i<900;i++){
    c.fillStyle = rnd()<.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.09)';
    c.fillRect(gx+((rnd()*gw)|0), gy+((rnd()*gh)|0), 1, 1);
  }

  const wear = (x,y,r)=>{
    const g = c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(120,90,40,.22)');
    g.addColorStop(1,'rgba(120,90,40,0)');
    c.fillStyle = g;
    c.fillRect(x-r,y-r,2*r,2*r);
  };
  wear(W/2,H/2,22); wear(WALL+6,H/2,22); wear(W-WALL-6,H/2,22);

  c.strokeStyle = 'rgba(255,255,255,.75)';
  c.lineWidth = 1;
  c.strokeRect(gx+.5, gy+.5, gw-1, gh-1);

  c.beginPath();
  c.moveTo(W/2+.5, gy);
  c.lineTo(W/2+.5, H-WALL);
  c.stroke();

  c.beginPath();
  c.arc(W/2+.5, H/2+.5, 22, 0, Math.PI*2);
  c.stroke();

  c.fillStyle = 'rgba(255,255,255,.85)';
  c.fillRect(W/2-1, H/2-1, 3, 3);

  const pH=68, pW=32, sH=30, sW=12;
  c.strokeRect(gx+.5, H/2-pH/2+.5, pW, pH);
  c.strokeRect(W-WALL-pW+.5, H/2-pH/2+.5, pW, pH);
  c.strokeRect(gx+.5, H/2-sH/2+.5, sW, sH);
  c.strokeRect(W-WALL-sW+.5, H/2-sH/2+.5, sW, sH);

  c.fillRect(gx+22, H/2, 2, 2);
  c.fillRect(W-WALL-24, H/2, 2, 2);

  c.beginPath();
  c.arc(gx+23, H/2+1, 12, -Math.acos(9/12), Math.acos(9/12));
  c.stroke();
  c.beginPath();
  c.arc(W-WALL-23, H/2+1, 12, Math.PI-Math.acos(9/12), Math.PI+Math.acos(9/12));
  c.stroke();

  for(const [x,y,a] of [[gx,gy,0],[W-WALL,gy,.5],[W-WALL,H-WALL,1],[gx,H-WALL,1.5]]){
    c.beginPath();
    c.arc(x+.5, y+.5, 4, a*Math.PI, (a+.5)*Math.PI);
    c.stroke();
  }

  const v = c.createRadialGradient(W/2,H/2,60, W/2,H/2,200);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,.35)');
  c.fillStyle = v;
  c.fillRect(0,0,W,H);
}
buildPitch();

/* =========================
   DRAW
========================= */

function drawPitch(){ ctx.drawImage(pitchCache, 0, 0); }

function drawGoals(){
  for(const g of GOALS){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(g.x, g.y, g.w, g.h);

    ctx.strokeStyle = 'rgba(240,240,240,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x=g.x; x<=g.x+g.w; x+=4){
      ctx.moveTo(x+.5, g.y);
      ctx.lineTo(x+.5, g.y+g.h);
    }
    for(let y=g.y; y<=g.y+g.h; y+=4){
      ctx.moveTo(g.x, y+.5);
      ctx.lineTo(g.x+g.w, y+.5);
    }
    ctx.stroke();

    ctx.strokeStyle = '#ccc';
    ctx.strokeRect(g.x+.5, g.y+.5, g.w-1, g.h-1);

    ctx.fillStyle = g.color;
    ctx.fillRect(g.x<W/2 ? g.x : g.x+g.w-1, g.y, 1, g.h);
  }

  ctx.fillStyle = '#fff';
  for(const p of POSTS){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#999';
    ctx.fillRect(p.x-1, p.y-1, 2, 2);
    ctx.fillStyle = '#fff';
  }
}

function drawBall(b){
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y+b.r+1, b.r, 2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(b.x|0, b.y|0, b.r, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#111';
  ctx.fillRect((b.x-1)|0, (b.y-1)|0, 3, 3);
  ctx.fillRect((b.x-3)|0, (b.y-2)|0, 2, 2);
  ctx.fillRect((b.x+2)|0, (b.y+1)|0, 2, 2);
}

function drawPlayer(p, isMe){
  const shirt = p.side === 'left' ? '#e63946' : '#2bff88';
  const shirtDark = p.side === 'left' ? '#d62828' : '#1fe07a';

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.atan2(p.facingY, p.facingX));

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 1, 6, 4, 0, 0, Math.PI*2);
  ctx.fill();

  const lo = Math.sin(p.walk*5)*2.5;

  ctx.fillStyle='#111';
  ctx.fillRect(-3+lo, -6, 3, 2);
  ctx.fillRect(-3-lo, 4, 3, 2);

  ctx.fillStyle='#f3b483';
  ctx.fillRect(-2+lo, -5, 2, 2);
  ctx.fillRect(-2-lo, 3, 2, 2);

  ctx.fillStyle='#fff';
  ctx.fillRect(-3, -5, 4, 3);
  ctx.fillRect(-3, 2, 4, 3);

  ctx.fillStyle = shirt;
  ctx.fillRect(-4, -4, 7, 8);

  ctx.fillStyle = shirtDark;
  ctx.fillRect(-4, -4, 2, 8);

  ctx.fillStyle='#f3b483';
  ctx.fillRect(-lo*.6, -6, 2, 2);
  ctx.fillRect(lo*.6, 4, 2, 2);

  ctx.beginPath();
  ctx.arc(0, 0, 3.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#3a2510';
  ctx.beginPath();
  ctx.arc(-1, 0, 3.2, Math.PI*.35, Math.PI*1.65);
  ctx.fill();

  ctx.fillStyle='#111';
  ctx.fillRect(1, -1.5, 1, 1);
  ctx.fillRect(1, .5, 1, 1);

  ctx.restore();

  if(isMe){
    ctx.save();
    ctx.globalAlpha = .55 + Math.sin(performance.now()*0.005)*.15;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawExplosion(){
  for(const sw of shock){
    const k = sw.t/40;

    if(sw.t < 12){
      ctx.globalAlpha = (1-sw.t/12)*.9;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, 6+sw.t*2.8, 0, Math.PI*2);
      ctx.fill();

      ctx.globalAlpha = (1-sw.t/12)*.6;
      ctx.fillStyle = sw.color;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, 10+sw.t*4, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.globalAlpha = 1-k;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 5*(1-k)+1;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, k*100, 0, Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle='#fff';
    ctx.lineWidth = 2*(1-k)+.5;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, k*62, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawGoalText(){
  if(!goalInfo) return;

  const t = 120 - goalTimer;
  const out = Math.min(1, goalTimer/20);

  const sc = t<12 ? t/12*1.4
           : t<20 ? 1.4-(t-12)/8*.4
           : 1 + Math.sin(t*.15)*.02;

  ctx.save();
  ctx.globalAlpha = out;
  ctx.translate(W/2, H/2-16);
  ctx.rotate(-.06);
  ctx.scale(sc, sc);

  const col = goalInfo.color;
  const bw = Math.min(1, t/10)*(W+40);

  ctx.fillStyle = col;
  ctx.globalAlpha = out*.55;
  ctx.fillRect(-bw/2, -19, bw, 38);

  ctx.globalAlpha = out;
  ctx.fillStyle = '#fff';
  ctx.fillRect(-bw/2, -19, bw, 1);
  ctx.fillRect(-bw/2, 18, bw, 1);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.font = '900 34px monospace';

  ctx.lineWidth = 7;
  ctx.strokeStyle = '#000';
  ctx.strokeText('GOAL!', 0, 0);

  ctx.lineWidth = 4;
  ctx.strokeStyle = col;
  ctx.strokeText('GOAL!', 0, 0);

  const gr = ctx.createLinearGradient(0,-16,0,16);
  gr.addColorStop(0,'#fff');
  gr.addColorStop(1,'#ffd23f');
  ctx.fillStyle = gr;
  ctx.fillText('GOAL!', 0, 0);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = out * Math.min(1, Math.max(0, (t-10)/8));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 13px monospace';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.strokeText(goalInfo.speedKph + ' kph', W/2, H/2 + 16);
  ctx.fillStyle = '#fff';
  ctx.fillText(goalInfo.speedKph + ' kph', W/2, H/2 + 16);
  ctx.restore();
}

function drawDashUI(){
  let me = null;
  if(mode === MODE.SINGLE) me = dispPlayers.find(p => p.side === 'left');
  else if(mode === MODE.ONLINE) me = dispPlayers.find(p => p.side === mySide);
  if(!me) return;

  const maxCD = 180;
  const ready = me.dashCooldown <= 0;
  const p = ready ? 1 : 1 - (me.dashCooldown / maxCD);

  const cx = 24, cy = H - 24, R = 9;

  ctx.save();

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.arc(cx, cy, R+3, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.stroke();

  const startAngle = -Math.PI/2;
  const endAngle = startAngle + Math.PI*2*p;

  ctx.strokeStyle = ready ? '#2bff88' : '#ffd23f';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, R, startAngle, endAngle);
  ctx.stroke();

  if(ready){
    ctx.globalAlpha = 0.35 + Math.sin(performance.now()*0.006)*0.15;
    ctx.fillStyle = '#2bff88';
    ctx.beginPath();
    ctx.arc(cx, cy, R-3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = ready ? '#0a0a0a' : 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.moveTo(cx+1,  cy-5);
  ctx.lineTo(cx-2,  cy+0.5);
  ctx.lineTo(cx+0.5,cy+0.5);
  ctx.lineTo(cx-1,  cy+5);
  ctx.lineTo(cx+3,  cy-1);
  ctx.lineTo(cx+0.5,cy-1);
  ctx.closePath();
  ctx.fill();

  ctx.font = 'bold 6px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = ready ? '#2bff88' : 'rgba(255,255,255,0.55)';
  ctx.fillText(ready ? 'READY' : 'DASH', cx, cy + R + 8);

  ctx.restore();
}

/* =========================
   RENDER
========================= */

function render(){
  ctx.save();

  if(shake > .3){
    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  drawPitch();
  drawGoals();

  if(!serverWon){
    drawBall(dispBall);
  }

  for(const p of particles){
    ctx.globalAlpha = Math.min(1, p.life/20);
    ctx.fillStyle = p.c;
    const z = p.s || 2;
    ctx.fillRect(p.x|0, p.y|0, z, z);
    ctx.globalAlpha = 1;
  }

  drawExplosion();

  for(const p of dispPlayers){
    const isMe =
      (mode === MODE.SINGLE && p.side === 'left') ||
      (mode === MODE.ONLINE && p.side === mySide);
    drawPlayer(p, isMe);
  }

  ctx.restore();

  if(flash > .02){
    ctx.globalAlpha = flash*.65;
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

  drawDashUI();

  if(serverWon){
    drawGoalText();
  }
}

/* =========================
   LOOP
========================= */

let acc = 0;
let last = performance.now();

function loop(now){
  let dt = (now - last)/1000;
  last = now;
  if(dt > .05) dt = .05;
  acc += dt;

  while(acc > 1/60){
    if(mode === MODE.ONLINE) interpolateOnline();
    else if(mode === MODE.SINGLE) stepSingleplayer();

    // particles
    flash *= .88;
    shake *= .9;
    for(const sw of shock) sw.t++;
    shock = shock.filter(sw => sw.t < 40);

    for(let i=particles.length-1; i>=0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= .93; p.vy *= .93;
      if(--p.life <= 0) particles.splice(i, 1);
    }

    if(goalTimer > 0) goalTimer--;

    acc -= 1/60;
  }

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
